name: Release

# 发版由「提交标题」决定：只有标题为 `tag:<version>`（如 `tag:0.7.1`）的提交才会
# 构建并推送镜像。GitHub Actions 的 on.push 只能按分支或 git tag 过滤，无法按提交
# 信息过滤，所以普通推送仍会创建一次运行，但只跑 verify；publish 作业用 if 门控，
# 跳过不计费。这样发版不再依赖 `git tag`，也不会每次 push 都覆盖 `latest`。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 每次提交单独成组且不取消进行中的运行：否则一条普通提交会把正在推送的发版任务
# 取消掉，留下半套镜像标签。
concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    name: Workspace check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      # Pinned to the version in the root package.json "volta" block. The suite
      # is documented as failing one case on Node 20, so do not relax this.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Workspace packages resolve each other through their built dist entry
      # points, so both `check` and `test` fail on a clean checkout unless the
      # packages are built first. This is not a cache artifact.
      - run: pnpm build

      - run: pnpm -r check

      # The root `pnpm test` script only covers @dsh-remote/server; run the
      # whole workspace (protocol, crypto, webrtc, server) instead.
      - run: pnpm -r test

  publish:
    name: Build and publish image
    needs: verify
    # 只处理标题以 `tag:` 开头的提交；更严格的格式与版本一致性校验在下一步，
    # 这样写错（如 tag:v1、tag:0.7）会显式失败，而不是静默跳过。
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'tag:')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 标题规则：`tag:` + 可选空格 + 可选 `v` + 三段 semver（可带 -rc.1 这类预发布
      # 后缀）。版本必须与 package.json 完全一致，避免镜像标签与代码版本漂移。
      - name: Resolve release version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          title=${COMMIT_MESSAGE%%$'\n'*}
          if [[ ! $title =~ ^tag:\ ?v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?)$ ]]; then
            echo "::error::发版提交标题必须是 'tag:<version>'（如 tag:0.7.1），当前标题：${title}"
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          declared=$(node -p "require('./package.json').version")
          if [[ $version != "$declared" ]]; then
            echo "::error::标题版本 ${version} 与 package.json 的 ${declared} 不一致，请先 bump package.json 再按 tag:${version} 提交"
            exit 1
          fi
          base=${version%%-*}
          prerelease=false; [[ $version == *-* ]] && prerelease=true
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${base%.*}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "release version: ${version} (prerelease=${prerelease})"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 发版只产出可追溯的标签：精确版本、minor、latest、sha。没有再发 `main`，
      # 因为普通提交不再发布，`main` 会名不副实。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
