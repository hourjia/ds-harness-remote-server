# Deployment compose file: pulls the prebuilt image from GHCR instead of
# building from source. Use this on a server; `compose.yaml` is for local builds.
#
#   cp .env.example .env   # then set DSH_SERVER_ACCOUNT / DSH_SERVER_PASSWORD / DSH_SERVER_PUBLIC_URL
#   docker compose -f compose.deploy.yaml pull
#   docker compose -f compose.deploy.yaml up -d
#
# Pin a release by setting DSH_SERVER_IMAGE_TAG (e.g. 0.6.3 or sha-abc1234)
# instead of tracking latest.
services:
  server:
    image: ghcr.io/hourjia/ds-harness-remote-server:${DSH_SERVER_IMAGE_TAG:-latest}
    # The listener inside the container is always 0.0.0.0:8080 (see the
    # Dockerfile). DSH_SERVER_HOST here only controls the host-side bind
    # address, so keep it at 127.0.0.1 when an HTTPS reverse proxy is in front.
    ports:
      - "${DSH_SERVER_HOST:-127.0.0.1}:${DSH_SERVER_PORT:-8080}:8080"
    environment:
      DSH_SERVER_ACCOUNT: ${DSH_SERVER_ACCOUNT:?Set DSH_SERVER_ACCOUNT in .env}
      DSH_SERVER_PASSWORD: ${DSH_SERVER_PASSWORD:?Set DSH_SERVER_PASSWORD in .env}
      # Must match the browser-facing origin exactly, including scheme and any
      # non-default port: a mismatch makes static assets fail with 403.
      DSH_SERVER_PUBLIC_URL: ${DSH_SERVER_PUBLIC_URL:-http://localhost:8080}
      # Set to the reverse proxy address as seen from this container, not
      # 127.0.0.1, and only when the backend port is not publicly reachable.
      DSH_SERVER_TRUSTED_PROXY_IPS: ${DSH_SERVER_TRUSTED_PROXY_IPS:-}
      DSH_SERVER_HELLO_TIMEOUT_MS: ${DSH_SERVER_HELLO_TIMEOUT_MS:-5000}
      DSH_SERVER_HEARTBEAT_INTERVAL_MS: ${DSH_SERVER_HEARTBEAT_INTERVAL_MS:-25000}
      DSH_SERVER_HEARTBEAT_DISCONNECT_MS: ${DSH_SERVER_HEARTBEAT_DISCONNECT_MS:-75000}
      DSH_SERVER_FORCE_TERMINATE_GRACE_MS: ${DSH_SERVER_FORCE_TERMINATE_GRACE_MS:-1000}
      DSH_SERVER_LOG_LEVEL: ${DSH_SERVER_LOG_LEVEL:-info}
      # Leave STUN/TURN empty for Relay-only operation.
      DSH_SERVER_STUN_URLS: ${DSH_SERVER_STUN_URLS:-}
      DSH_SERVER_TURN_URLS: ${DSH_SERVER_TURN_URLS:-}
      DSH_SERVER_TURN_SECRET: ${DSH_SERVER_TURN_SECRET:-}
      DSH_SERVER_TURN_USERNAME: ${DSH_SERVER_TURN_USERNAME:-}
      DSH_SERVER_TURN_PASSWORD: ${DSH_SERVER_TURN_PASSWORD:-}
      DSH_SERVER_TURN_TTL_SECONDS: ${DSH_SERVER_TURN_TTL_SECONDS:-300}
    volumes:
      # Holds state.json: account verifier plus device credentials. Never
      # recreate this volume casually (`down -v` wipes every registered device).
      - server-data:/data
    restart: unless-stopped
    init: true

volumes:
  server-data:
